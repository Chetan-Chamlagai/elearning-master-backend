apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config-elp
  namespace: elearning
data:
  MYSQL_DATABASE: "ELP"
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-elp
  namespace: elearning
spec:
  clusterIP: None
  selector:
    app: mysql-elp
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-elp
  namespace: elearning
spec:
  serviceName: mysql-elp
  replicas: 1
  selector:
    matchLabels:
      app: mysql-elp
  template:
    metadata:
      labels:
        app: mysql-elp
    spec:
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: production-worker-3
      securityContext:
        fsGroup: 999
      containers:
        - name: mysql-elp
          image: mysql:8.0.36
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elp-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: mysql-config-elp
                  key: MYSQL_DATABASE
          securityContext:
            runAsUser: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1"
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h localhost -uroot --password="${MYSQL_ROOT_PASSWORD}"
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h localhost -uroot --password="${MYSQL_ROOT_PASSWORD}"
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysql -h localhost -uroot -p"${MYSQL_ROOT_PASSWORD}" -e "SELECT 1"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: mysql-data-elp
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-data-elp
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
